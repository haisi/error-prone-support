project:
  name: bugpatterns
  description: Custom Error Prone bug patterns, starting with a configurable ForbiddenApi checker for signature-based API bans.
  longDescription: |
    Custom Error Prone bug patterns, starting with a configurable ForbiddenApi checker for signature-based API bans.
  links:
    homepage: https://github.com/haisi/error-prone-support
  authors:
    - Hasan Selman Kara
  license: Apache-2.0
  inceptionYear: "2026"
  languages:
    java:
      groupId: li.selman.error-prone
      version: "25"

release:
  github:
    owner: haisi
    name: error-prone-support
    overwrite: true
    changelog:
      formatted: ALWAYS
      preset: conventional-commits

signing:
  active: ALWAYS
  pgp:
    armored: true

deploy:
  maven:
    mavenCentral:
      sonatype:
        active: ALWAYS
        url: https://central.sonatype.com/api/v1/publisher
        stagingRepositories:
          - target/staging-deploy
        applyMavenCentralRules: true
