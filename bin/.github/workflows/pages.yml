name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Needed to look up and download the nightly PIT workflow's last successful mutation report.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build, test and generate reports
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Assemble site
        run: |
          rm -rf site
          mkdir -p site
          cp -r docs/. site/
          cp -r target/site/jacoco site/coverage
          cp -r target/site/tests site/tests

      - name: Carry forward the last published mutation report
        # This workflow never runs PIT itself (see pit-mutation-testing.yml) - without this step,
        # deploying the site fresh on every push would silently remove whatever the nightly PIT
        # workflow last published under /pit/, since only one deployment can be live at a time.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/fetch-latest-pit-report.sh site/pit

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
